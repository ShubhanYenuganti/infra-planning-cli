version: 2
project_name: functions-pp-cli
changelog:
  disable: true
builds:
  - id: functions-pp-cli
    main: ./cmd/functions-pp-cli
    binary: functions-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X functions-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: functions-pp-mcp
    main: ./cmd/functions-pp-mcp
    binary: functions-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: functions-pp-cli
    repository:
      owner: shubhan-yenuganti
      name: homebrew-tap
    homepage: "https://github.com/shubhan-yenuganti/functions-pp-cli"
    description: ""
    install: |
      bin.install "functions-pp-cli"
      bin.install "functions-pp-mcp"
