version: 1
clis:
  - name: cloud-run-admin-pp-cli
    cloud: gcp
    service: cloud-run-admin
    paradigm: serverless-containers
    path: library/gcp/cloud-run-admin
    binary: cloud-run-admin-pp-cli
    install: github.com/ShubhanYenuganti/infra-press/library/gcp/cloud-run-admin/cmd/cloud-run-admin-pp-cli
    status: preview
    press_version: v1.3.2
    spec_version: v2
    spec_url: https://api.apis.guru/v2/specs/googleapis.com/run/v2/openapi.json
    daily_commands: [api, resource-get-iam-policy, doctor]
    compound_commands: []
    known_gaps:
      - "7 GCP hierarchical paths skipped by press (parent-based routes)"
      - "sync/search/sql return not-yet-implemented (full backend in v1.1)"
