version: 1
clis:
  - name: cloud-run-admin-pp-cli
    cloud: gcp
    service: cloud-run-admin
    paradigm: serverless-containers
    path: library/gcp/cloud-run-admin
    binary: cloud-run-admin-pp-cli
    install: github.com/ShubhanYenuganti/infra-press/library/gcp/cloud-run-admin/cmd/cloud-run-admin-pp-cli
    status: preview
    press_version: v1.3.2
    spec_version: v2
    spec_url: https://api.apis.guru/v2/specs/googleapis.com/run/v2/openapi.json
    daily_commands: [api, resource-get-iam-policy, doctor]
    compound_commands: []
    known_gaps:
      - "7 GCP hierarchical paths skipped by press (parent-based routes)"
      - "sync/search/sql return not-yet-implemented (full backend in v1.1)"
  - name: cloud-functions-pp-cli
    cloud: gcp
    service: cloud-functions
    paradigm: serverless
    path: library/gcp/cloud-functions
    binary: cloud-functions-pp-cli
    install: github.com/ShubhanYenuganti/infra-press/library/gcp/cloud-functions/cmd/cloud-functions-pp-cli
    status: preview
    press_version: v1.3.2
    spec_version: v2
    spec_url: https://api.apis.guru/v2/specs/googleapis.com/cloudfunctions/v2/openapi.json
    daily_commands: [api, doctor]
    compound_commands: []
    known_gaps:
      - "sync/search/sql return not-yet-implemented (full backend in v1.1)"
  - name: lambda-pp-cli
    cloud: aws
    service: lambda
    paradigm: serverless
    path: library/aws/lambda
    binary: lambda-pp-cli
    install: github.com/ShubhanYenuganti/infra-press/library/aws/lambda/cmd/lambda-pp-cli
    status: preview
    press_version: v1.3.2
    spec_version: "2015-03-31"
    spec_url: https://api.apis.guru/v2/specs/amazonaws.com/lambda/2015-03-31/openapi.json
    daily_commands: [api, doctor, export]
    compound_commands: []
    known_gaps:
      - "sync/search/sql return not-yet-implemented (full backend in v1.1)"
  - name: apprunner-pp-cli
    cloud: aws
    service: apprunner
    paradigm: serverless-containers
    path: library/aws/apprunner
    binary: apprunner-pp-cli
    install: github.com/ShubhanYenuganti/infra-press/library/aws/apprunner/cmd/apprunner-pp-cli
    status: preview
    press_version: v1.3.2
    spec_version: "2020-05-15"
    spec_url: https://api.apis.guru/v2/specs/amazonaws.com/apprunner/2020-05-15/openapi.json
    daily_commands: [api, doctor, export]
    compound_commands: []
    known_gaps:
      - "sync/search/sql return not-yet-implemented (full backend in v1.1)"
  - name: functions-pp-cli
    cloud: azure
    service: functions
    paradigm: serverless
    path: library/azure/functions
    binary: functions-pp-cli
    install: github.com/ShubhanYenuganti/infra-press/library/azure/functions/cmd/functions-pp-cli
    status: preview
    press_version: v1.3.2
    spec_version: "2018-11-01"
    spec_url: https://api.apis.guru/v2/specs/azure.com/web-WebApps/2018-11-01/swagger.json
    spec_pipeline: [swagger2openapi]
    daily_commands: [api, doctor]
    compound_commands: []
    known_gaps:
      - "Azure ARM hierarchical paths likely skipped by press (parallel to GCP behavior)"
      - "sync/search/sql return not-yet-implemented (full backend in v1.1)"
  - name: container-apps-pp-cli
    cloud: azure
    service: container-apps
    paradigm: serverless-containers
    path: library/azure/container-apps
    binary: container-apps-pp-cli
    install: github.com/ShubhanYenuganti/infra-press/library/azure/container-apps/cmd/container-apps-pp-cli
    status: preview
    press_version: v1.3.2
    spec_version: "2024-03-01"
    spec_url: https://raw.githubusercontent.com/Azure/azure-rest-api-specs/main/specification/app/resource-manager/Microsoft.App/ContainerApps/stable/2024-03-01/ContainerApps.json
    spec_pipeline: [swagger2openapi]
    daily_commands: [api, doctor]
    compound_commands: []
    known_gaps:
      - "Azure ARM hierarchical paths likely skipped by press (parallel to GCP behavior)"
      - "Spec sourced from azure-rest-api-specs (not apis.guru); URL must be re-pinned on regen"
      - "sync/search/sql return not-yet-implemented (full backend in v1.1)"
